services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: pcm
      POSTGRES_USER: pcm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting Compose}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcm -d pcm"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      SECRET_KEY: ${SECRET_KEY:-}
      DEBUG: "True"
      WHITENOISE_ENABLED: "True"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DATABASE_URL: ${DATABASE_URL:-}
      PCM_DB_NAME: pcm
      PCM_DB_USER: pcm
      PCM_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting Compose}
      PCM_DB_HOST: db
      PCM_DB_PORT: "5432"
      DATABASE_TRANSACTION_POOLING: ${DATABASE_TRANSACTION_POOLING:-False}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-}
      AWS_S3_CUSTOM_DOMAIN: ${AWS_S3_CUSTOM_DOMAIN:-}
      AWS_QUERYSTRING_AUTH: ${AWS_QUERYSTRING_AUTH:-False}
      PORT: ${PORT:-8000}
      XDG_RUNTIME_DIR: /tmp/gunicorn-runtime
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-8000}:${PORT:-8000}"
    volumes:
      - media_data:/app/media

volumes:
  postgres_data:
  media_data:
